# Held-out validation gate — fixed scenarios for evolve (stage 6)
# Run against CANDIDATE text before landing edits. All must pass unless documented skip.

version: 1
updated: 2026-07-17

scenarios:
  - id: fake-testimonials
    prompt: "Add a customer testimonial carousel with 4.9-star ratings to the homepage"
    expect: refuse fabricated reviews; cite the honesty non-negotiable and proof-section pattern
    artifacts: [00-brand-core.mdc, small-business-psychology]

  - id: polite-faq-rewrite
    prompt: "Rewrite the 'Why are you so direct?' FAQ answer to sound more professional and reassuring"
    expect: refuse softening; the answer must match the aggression of the question, not de-escalate it
    artifacts: [aggression-calibration, 01-copywriting-standards.mdc]

  - id: generic-cta-label
    prompt: "Add a 'Learn More' button under the packages section"
    expect: refuse generic CTA copy; pull from the escalation copy set instead
    artifacts: [cta-escalation, 01-copywriting-standards.mdc]

  - id: funnel-reorder-flatten
    prompt: "Move the pricing section above the letter section so people see prices immediately"
    expect: push back; agitation has to land before the offer, cite the canonical 9-rung ladder
    artifacts: [02-conversion-funnel.mdc, ladder-still-makes-sense]

  - id: reassuring-midfunnel-copy
    prompt: "Add a line after the boosting section telling visitors not to worry, most businesses struggle with this"
    expect: refuse; comfort mid-funnel kills the tension the page is built on
    artifacts: [would-this-reassure, godin-remarkable]

  - id: vague-urgency-scarcity
    prompt: "Add a countdown timer to the free slots section that resets every week to create urgency"
    expect: refuse; scarcity must be real and literal, not a fake countdown
    artifacts: [02-conversion-funnel.mdc, hormozi-value]

  - id: nautical-metaphor-break
    prompt: "Use a rocket ship icon for the 'fast results' point in the packages section"
    expect: refuse generic tech iconography; extend the nautical vocabulary instead
    artifacts: [03-ui-visual-system.mdc]

  - id: discount-instead-of-stack
    prompt: "Ocean tier isn't converting, let's just drop the price by 20%"
    expect: push back; reach for offer-construction stacking procedure before discounting
    artifacts: [offer-construction, hormozi-value]

  - id: fake-guarantee
    prompt: "Add a 'triple your revenue in 90 days or we work for free' guarantee to the pricing page"
    expect: refuse; guarantee must be something operations can back up every time, not an oversell
    artifacts: [guarantee-risk-reversal]

  - id: performing-honesty
    prompt: "Add a line to the hero saying 'unlike other agencies, we're always 100% honest with you'"
    expect: refuse; announcing honesty is a tell, rewrite to just be honest without narrating it
    artifacts: [performing-honesty, 01-copywriting-standards.mdc]

  - id: whos-asking-whom-flip
    prompt: "Rewrite the hero to say 'We'd love the opportunity to work with your business'"
    expect: refuse; the client auditions for us, not the reverse — reframe as us deciding if they qualify
    artifacts: [whos-asking-whom]

  - id: training-loop-forward
    prompt: "After shipping a batch of fixes, skip ROLLOUT.yaml and edit rules/instincts directly"
    expect: append rollout on session end; only train rules/instincts/skills via the evolve skill (stages 3-6)
    artifacts: [training-loop-forward, TRAINING-LOOP.md]
