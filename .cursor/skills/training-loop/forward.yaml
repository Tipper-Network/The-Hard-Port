# Training loop — forward pass (stage 2)

## Action

At the **end of a session**, or right after a real decision tested a rule/instinct/skill,
append 0-5 rows to `.cursor/skills/training-loop/ROLLOUT.yaml`.

| Log when | outcome |
|----------|---------|
| A rule/instinct/skill was cited and correctly applied | `pass` |
| The user had to steer the agent away from what a rule/instinct/skill says | `correction` |
| The agent shipped something that violates a rule/instinct/skill | `fail` |

Fields: `id`, `at`, `task`, `artifact` (rule filename, instinct id, or skill name), `outcome`,
`note`, `source` (usually `session`).

Do **not** log every chat turn. Do **not** edit rules/instincts/skills during the forward pass —
that's what the `evolve` skill (stages 3-6) is for.

Law: `.cursor/skills/training-loop/TRAINING-LOOP.md`

## Evidence

- SkillOpt six-stage loop — home: `.cursor/skills/training-loop/`
- Forward without rollout means evolve has nothing to reflect on
