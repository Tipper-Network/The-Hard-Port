# Local platform Postgres only (Access + Payments tests / dogfood).
# Website intake DB stays separate (Neon / apps/api).
#
#   docker compose -f docker-compose.platform-dev.yml up -d
#   DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5433/hp_platform pnpm platform:migrate

name: thp-platform-dev

services:
  platform-db:
    image: postgres:16-alpine
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hp_platform
    volumes:
      - thp_platform_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d hp_platform']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  thp_platform_pg:
